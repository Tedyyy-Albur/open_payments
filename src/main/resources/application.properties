spring.application.name=payments
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/interleject
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# 'update' para desarrollo, 'validate' o 'none' para producción
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Key
# Genera una clave segura y larga. Puedes usar un generador online.
jwt.secret=tuClaveSecretaSuperLargaYComplejaParaFirmarTokensJWTQueNadiePuedaAdivinar